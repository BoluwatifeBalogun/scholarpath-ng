{% macro icon(name) -%}
<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
{%- if name == 'arrow' %}<path d="M4 12h15M13 6l6 6-6 6"/>
{%- elif name == 'alert' %}<path d="M12 3 2 20h20zM12 10v5M12 17.5v.01"/>
{%- elif name == 'info' %}<rect x="3" y="3" width="18" height="18"/><path d="M12 11v6M12 7.5v.01"/>
{%- elif name == 'download' %}<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'predict' %}<path d="M6 4v6l6 4 6-4V4M12 14v6"/>
{%- elif name == 'history' %}<path d="M5 5h14M5 12h14M5 19h9"/>
{%- elif name == 'data' %}<rect x="4" y="4" width="16" height="16"/><path d="M4 10h16M4 15h16M10 4v16"/>
{%- elif name == 'model' %}<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3"/>
{%- elif name == 'home' %}<path d="M4 11l8-7 8 7v9h-6v-6h-4v6H4z"/>
{%- elif name == 'grid' %}<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>
{%- elif name == 'upload' %}<path d="M12 16V5M7 9l5-5 5 5M4 20h16"/>
{%- elif name == 'trash' %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
{%- elif name == 'out' %}<path d="M14 4h6v16h-6M4 12h11M11 8l4 4-4 4"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% endmacro %}

{% macro dot(t, label) %}<span class="dot c{{ t }}"><i></i>{{ label }}</span>{% endmacro %}

{% macro logo() -%}
<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M8 8l8 9v8M24 8l-8 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="square"/><rect x="13.2" y="22" width="5.6" height="5.6" fill="#F5C518"/></svg>
{%- endmacro %}
