{% extends "public.html" %}
{% block title %}Sign in | {{ app_name }}{% endblock %}
{% block main %}
<div class="auth"><form class="auth-card" method="post" novalidate>
  {{ m.csrf() }}
  <h1>Sign in</h1>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  {% if error %}<div class="callout bad" role="alert" style="margin-bottom:18px">{{ m.icon('alert') }}<p>{{ error }}</p></div>{% endif %}
  <div class="field"><label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required></div>
  <div class="field"><label for="password">Password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn yellow" type="submit" style="width:100%">Sign in</button>
</form></div>
{% endblock %}
