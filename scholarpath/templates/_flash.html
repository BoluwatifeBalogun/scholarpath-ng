{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}
<div class="flashes" role="status" aria-live="polite">
  {% for cat, msg in messages %}<div class="flash {{ cat }}"><span>{{ msg }}</span><button type="button" aria-label="Dismiss" data-dismiss>&times;</button></div>{% endfor %}
</div>{% endif %}{% endwith %}
